# Canonical Schema Configuration for Adaptive Temporal-Relational IDS
schema_version: "2.2.0"

# 6-Group Taxonomy Definitions
canonical_groups:
  group_1_identity_relational:
    - src_ip
    - dst_ip
    - src_port
    - dst_port
    - protocol
    - l7_proto

  group_2_temporal_dynamics:
    - flow_duration_ms
    - duration_in
    - duration_out
    - flow_iat_mean
    - flow_iat_std
    - min_ttl
    - max_ttl

  group_3_volume_metrics:
    - total_fwd_bytes
    - total_bwd_bytes
    - total_fwd_packets
    - total_bwd_packets
    - min_pkt_len
    - max_pkt_len
    - longest_flow_pkt
    - shortest_flow_pkt

  group_4_directional_rates:
    - fwd_byte_rate
    - bwd_byte_rate
    - src_to_dst_second_bytes
    - dst_to_src_second_bytes
    - fwd_throughput
    - bwd_throughput
    - pkts_up_to_128
    - pkts_128_to_256
    - pkts_256_to_512
    - pkts_512_to_1024
    - pkts_1024_to_1514

  group_5_statistical_behavior:
    - tcp_flags
    - client_tcp_flags
    - server_tcp_flags
    - retransmitted_in_bytes
    - retransmitted_in_pkts
    - retransmitted_out_bytes
    - retransmitted_out_pkts
    - tcp_win_max_in
    - tcp_win_max_out
    - icmp_type
    - dns_query_id
    - ftp_cmd_code

  group_6_ground_truth_labels:
    - label_binary
    - label_attack_family
    - label_specific_attack

# Comprehensive column alias dictionary mapping raw headers across ALL datasets to canonical names
datasets:
  nf_cse_cic_ids2018_v2:
    format: netflow_v2
    columns:
      IPV4_SRC_ADDR: src_ip
      L4_SRC_PORT: src_port
      IPV4_DST_ADDR: dst_ip
      L4_DST_PORT: dst_port
      PROTOCOL: protocol
      L7_PROTO: l7_proto
      IN_BYTES: total_fwd_bytes
      IN_PKTS: total_fwd_packets
      OUT_BYTES: total_bwd_bytes
      OUT_PKTS: total_bwd_packets
      TCP_FLAGS: tcp_flags
      CLIENT_TCP_FLAGS: client_tcp_flags
      SERVER_TCP_FLAGS: server_tcp_flags
      FLOW_DURATION_MILLISECONDS: flow_duration_ms
      DURATION_IN: duration_in
      DURATION_OUT: duration_out
      MIN_TTL: min_ttl
      MAX_TTL: max_ttl
      LONGEST_FLOW_PKT: longest_flow_pkt
      SHORTEST_FLOW_PKT: shortest_flow_pkt
      MIN_IP_PKT_LEN: min_pkt_len
      MAX_IP_PKT_LEN: max_pkt_len
      SRC_TO_DST_SECOND_BYTES: src_to_dst_second_bytes
      DST_TO_SRC_SECOND_BYTES: dst_to_src_second_bytes
      RETRANSMITTED_IN_BYTES: retransmitted_in_bytes
      RETRANSMITTED_IN_PKTS: retransmitted_in_pkts
      RETRANSMITTED_OUT_BYTES: retransmitted_out_bytes
      RETRANSMITTED_OUT_PKTS: retransmitted_out_pkts
      SRC_TO_DST_AVG_THROUGHPUT: fwd_throughput
      DST_TO_SRC_AVG_THROUGHPUT: bwd_throughput
      NUM_PKTS_UP_TO_128_BYTES: pkts_up_to_128
      NUM_PKTS_128_TO_256_BYTES: pkts_128_to_256
      NUM_PKTS_256_TO_512_BYTES: pkts_256_to_512
      NUM_PKTS_512_TO_1024_BYTES: pkts_512_to_1024
      NUM_PKTS_1024_TO_1514_BYTES: pkts_1024_to_1514
      TCP_WIN_MAX_IN: tcp_win_max_in
      TCP_WIN_MAX_OUT: tcp_win_max_out
      ICMP_TYPE: icmp_type
      DNS_QUERY_ID: dns_query_id
      FTP_COMMAND_RET_CODE: ftp_cmd_code
      Label: label_binary
      Attack: label_specific_attack

  nf_unsw_nb15_v2:
    format: netflow_v2
    columns:
      IPV4_SRC_ADDR: src_ip
      L4_SRC_PORT: src_port
      IPV4_DST_ADDR: dst_ip
      L4_DST_PORT: dst_port
      PROTOCOL: protocol
      L7_PROTO: l7_proto
      IN_BYTES: total_fwd_bytes
      IN_PKTS: total_fwd_packets
      OUT_BYTES: total_bwd_bytes
      OUT_PKTS: total_bwd_packets
      TCP_FLAGS: tcp_flags
      CLIENT_TCP_FLAGS: client_tcp_flags
      SERVER_TCP_FLAGS: server_tcp_flags
      FLOW_DURATION_MILLISECONDS: flow_duration_ms
      DURATION_IN: duration_in
      DURATION_OUT: duration_out
      MIN_TTL: min_ttl
      MAX_TTL: max_ttl
      LONGEST_FLOW_PKT: longest_flow_pkt
      SHORTEST_FLOW_PKT: shortest_flow_pkt
      MIN_IP_PKT_LEN: min_pkt_len
      MAX_IP_PKT_LEN: max_pkt_len
      SRC_TO_DST_SECOND_BYTES: src_to_dst_second_bytes
      DST_TO_SRC_SECOND_BYTES: dst_to_src_second_bytes
      RETRANSMITTED_IN_BYTES: retransmitted_in_bytes
      RETRANSMITTED_IN_PKTS: retransmitted_in_pkts
      RETRANSMITTED_OUT_BYTES: retransmitted_out_bytes
      RETRANSMITTED_OUT_PKTS: retransmitted_out_pkts
      SRC_TO_DST_AVG_THROUGHPUT: fwd_throughput
      DST_TO_SRC_AVG_THROUGHPUT: bwd_throughput
      NUM_PKTS_UP_TO_128_BYTES: pkts_up_to_128
      NUM_PKTS_128_TO_256_BYTES: pkts_128_to_256
      NUM_PKTS_256_TO_512_BYTES: pkts_256_to_512
      NUM_PKTS_512_TO_1024_BYTES: pkts_512_to_1024
      NUM_PKTS_1024_TO_1514_BYTES: pkts_1024_to_1514
      TCP_WIN_MAX_IN: tcp_win_max_in
      TCP_WIN_MAX_OUT: tcp_win_max_out
      ICMP_TYPE: icmp_type
      DNS_QUERY_ID: dns_query_id
      FTP_COMMAND_RET_CODE: ftp_cmd_code
      Label: label_binary
      Attack: label_specific_attack

  cse_cic_ids2018:
    format: cicflowmeter
    columns:
      Src IP: src_ip
      Dst IP: dst_ip
      Src Port: src_port
      Dst Port: dst_port
      Protocol: protocol
      Timestamp: timestamp_str
      Flow Duration: flow_duration_ms
      Tot Fwd Pkts: total_fwd_packets
      Tot Bwd Pkts: total_bwd_packets
      TotLen Fwd Pkts: total_fwd_bytes
      TotLen Bwd Pkts: total_bwd_bytes
      Fwd Pkt Len Max: max_pkt_len
      Fwd Pkt Len Min: min_pkt_len
      Fwd Pkt Len Mean: pkt_len_mean
      Fwd Pkt Len Std: pkt_len_std
      Flow Byts/s: fwd_byte_rate
      Flow Pkts/s: fwd_packet_rate
      Flow IAT Mean: flow_iat_mean
      Flow IAT Std: flow_iat_std
      FIN Flag Cnt: fin_flag_cnt
      SYN Flag Cnt: syn_flag_cnt
      RST Flag Cnt: rst_flag_cnt
      PSH Flag Cnt: psh_flag_cnt
      ACK Flag Cnt: ack_flag_cnt
      URG Flag Cnt: urg_flag_cnt
      Label: label_specific_attack
